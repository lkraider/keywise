name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The tag names the artifacts. macos/Info.plist holds the version the app
      # reports. release-set-version.sh compares the tag with every such file.
      - name: Check the tag against every file that holds the version
        run: ./scripts/release-set-version.sh --check "${GITHUB_REF_NAME#v}"

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: Package the release artifacts
        run: ./scripts/release-package.sh "${GITHUB_REF_NAME#v}" dist

      # LC_UUID and the code signature still follow the installed macOS SDK.
      # This file records what the runner had, so a hash that moves between
      # two releases can be traced to the toolchain that produced it.
      #
      # tar, gzip and zip decide the published archive bytes as much as the
      # compiler does. bsdtar's default format writes an AppleDouble member
      # for an extended attribute, and Apple gzip emits a different deflate
      # stream than GNU gzip for one input. ditto accepts no version flag, so
      # the macOS version above is its only record.
      #
      # date reads the runner's zone. TZ=UTC sits on the individual zip and
      # ditto calls inside release-package.sh, so echo "$TZ" prints nothing.
      - name: Record the build environment
        working-directory: dist
        run: |
          zig="../zig/zig-aarch64-macos-${ZIG_VERSION}/zig"
          {
            echo "zig       $("$zig" version)"
            echo "macos     $(sw_vers -productVersion)"
            echo "sdk       $(xcrun --show-sdk-version)"
            echo "swift     $(swift --version | head -1)"
            echo "tar       $(tar --version | head -1)"
            echo "gzip      $(gzip --version 2>&1 | head -1)"
            echo "zip       $(zip -v | grep -m1 'This is Zip')"
            echo "host tz   $(date +%Z%z)"
          } | tee BUILDINFO.txt

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 * | tee SHA256SUMS

      # Formula/keywise.rb and Casks/keywise-app.rb hold a SHA-256 from a
      # ci.yml run, committed before the tag. This job builds on a second
      # macos-15 runner. A runner image with a newer macOS SDK writes a
      # different LC_UUID, and the committed hash then misses these assets.
      # A mismatch here exits before the upload, so brew reaches no release.
      - name: Check the committed hashes against these assets
        working-directory: dist
        run: |
          tar_sum=$(awk '$2 == "keywise-aarch64-macos.tar.gz" {print $1}' SHA256SUMS)
          app_sum=$(awk '$2 ~ /-macos\.zip$/ {print $1}' SHA256SUMS)
          src_sum=$(awk '$2 ~ /-source\.tar\.gz$/ {print $1}' SHA256SUMS)
          [ -n "$tar_sum" ] && [ -n "$app_sum" ] && [ -n "$src_sum" ] \
            || { echo "missing sum in SHA256SUMS" >&2; exit 1; }
          grep -q "$tar_sum" ../Formula/keywise.rb \
            || { echo "Formula/keywise.rb needs $tar_sum" >&2; exit 1; }
          grep -q "$app_sum" ../Casks/keywise-app.rb \
            || { echo "the cask needs $app_sum" >&2; exit 1; }
          grep -q "$src_sum" ../ports/freebsd/distinfo \
            || { echo "ports/freebsd/distinfo needs $src_sum" >&2; exit 1; }
          grep -q "$src_sum" ../ports/macports/Portfile \
            || { echo "ports/macports/Portfile needs $src_sum" >&2; exit 1; }
          src_b64=$(echo "$src_sum" | xxd -r -p | base64)
          grep -q "$src_b64" ../ports/openbsd/distinfo \
            || { echo "ports/openbsd/distinfo needs $src_b64" >&2; exit 1; }

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
