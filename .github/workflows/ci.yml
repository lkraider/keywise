name: CI

on:
  push:
    branches: [main]
    # A skipped workflow reports no status and blocks required checks.
    # Use job-level if: instead.
    paths-ignore:
      - 'Formula/**'
      - 'Casks/**'
      - 'bucket/**'
      - 'ports/**'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  macos-test:
    # The oracle needs the macOS SDK. The app needs Swift 6 from
    # macos-15's Xcode.
    runs-on: macos-15

    outputs:
      win_x86_64: ${{ steps.sums.outputs.win_x86_64 }}
      win_arm64: ${{ steps.sums.outputs.win_arm64 }}
      linux_x86_64: ${{ steps.sums.outputs.linux_x86_64 }}
      linux_arm64: ${{ steps.sums.outputs.linux_arm64 }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: test-check
        run: ZIG=./zig/zig-aarch64-macos-${ZIG_VERSION}/zig ./scripts/test-check.sh smoke

      - name: Build the Zig core (release, for swift test to link)
        run: ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build -Doptimize=ReleaseSafe

      - name: swift test
        working-directory: macos
        run: swift test -Xswiftc -F -Xswiftc /Library/Developer/CommandLineTools/Library/Developer/Frameworks

      - name: Package the release artifacts
        run: |
          version=$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          ./scripts/release-package.sh "$version" dist

      - name: Record each cross-compiled binary's sum
        id: sums
        run: |
          for pair in "win-x86_64 Keywise.exe" "win-arm64 Keywise.exe" \
                      "linux-x86_64 keywise" "linux-arm64 keywise"; do
            set -- $pair
            sum=$(shasum -a 256 "out-$1/bin/$2" | cut -d' ' -f1)
            echo "sha256 $sum  $1  built on macOS ARM64"
            echo "- \`$1\` built on \`macOS ARM64\`, the host that builds a release: \`$sum\`" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "$(echo "$1" | tr - _)=$sum" >> "$GITHUB_OUTPUT"
          done
          echo "tar_hash=$(shasum -a 256 dist/keywise-aarch64-macos.tar.gz | cut -d' ' -f1)" > archive-hashes.env
          echo "app_hash=$(shasum -a 256 dist/Keywise-*-macos.zip | cut -d' ' -f1)" >> archive-hashes.env
          echo "win_x64=$(shasum -a 256 dist/Keywise-*-windows-x86_64.zip | cut -d' ' -f1)" >> archive-hashes.env
          echo "win_arm=$(shasum -a 256 dist/Keywise-*-windows-arm64.zip | cut -d' ' -f1)" >> archive-hashes.env

      - name: Record port hashes
        run: |
          version=$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          mv "dist/keywise-${version}-source.tar.gz" .
          f="keywise-${version}-source.tar.gz"
          echo "src_sha256=$(shasum -a 256 "$f" | cut -d' ' -f1)" > src-hashes.env
          echo "src_rmd160=$(openssl dgst -rmd160 "$f" | awk '{print $NF}')" >> src-hashes.env
          echo "src_sha256_b64=$(openssl dgst -sha256 -binary "$f" | openssl base64 -A)" >> src-hashes.env
          echo "src_size=$(stat -f%z "$f")" >> src-hashes.env

          lv_commit=$(sed -n 's/.*#\([0-9a-f]\{40\}\)".*/\1/p' build.zig.zon)
          f="lv-${lv_commit}.tar.gz"
          curl -fsSL "https://github.com/rockorager/libvaxis/archive/${lv_commit}.tar.gz" -o "$f"
          echo "lv_sha256=$(shasum -a 256 "$f" | cut -d' ' -f1)" > lv-hashes.env
          echo "lv_rmd160=$(openssl dgst -rmd160 "$f" | awk '{print $NF}')" >> lv-hashes.env
          echo "lv_sha256_b64=$(openssl dgst -sha256 -binary "$f" | openssl base64 -A)" >> lv-hashes.env
          echo "lv_size=$(stat -f%z "$f")" >> lv-hashes.env
          echo "lv_commit=$lv_commit" >> lv-hashes.env

      - name: Upload release hashes
        uses: actions/upload-artifact@v7
        with:
          name: release-hashes
          path: |
            src-hashes.env
            lv-hashes.env
            archive-hashes.env
            keywise-*-source.tar.gz
          retention-days: 90


  windows-test:
    # No sqlite3 headers on Windows, so the oracle test skips itself.
    runs-on: windows-latest

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # Tests run at ReleaseSafe to match the released exe.
      - name: Test and build the app twice, in parallel
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target x86_64-windows-gnu -Twice -WithTests

      - name: Launch the app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  windows-arm-test:
    # The native aarch64-windows Zig compiler crashes on `zig build`.
    # This uses x86_64 Zig under WoA emulation to cross-compile, then
    # launches the arm64 exe on native hardware.
    runs-on: windows-11-arm

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # One build: the emulated compiler is slow.
      - name: Cross-compile the arm64 app and record its sum
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target aarch64-windows-gnu

      - name: Launch the arm64 app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  linux-test:
    # The oracle gates on builtin.os.tag == .macos, so it skips here.
    runs-on: ubuntu-latest

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-linux-${{ env.ZIG_VERSION }}
          key: zig-x86_64-linux-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: test-check
        run: ZIG=./zig/zig-x86_64-linux-${ZIG_VERSION}/zig ./scripts/test-check.sh --no-oracle

      - name: Build the TUI for x86_64-linux-musl and record its sum
        id: build
        run: |
          ./zig/zig-x86_64-linux-${ZIG_VERSION}/zig build \
            -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
          # `file` calls a static PIE "static-pie linked", so a grep for
          # "statically linked" fails on a correct binary. PT_INTERP decides.
          count=$(readelf -l zig-out/bin/keywise | grep -c INTERP || true)
          [ "$count" -eq 0 ] || { echo "keywise carries a PT_INTERP segment" >&2; exit 1; }
          sum=$(sha256sum zig-out/bin/keywise | cut -d' ' -f1)
          echo "sha256 $sum  x86_64-linux-musl  built on ubuntu-latest"
          echo "- \`x86_64-linux-musl\` built on \`ubuntu-latest\`: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Drive the non-interactive Linux paths
        run: ./scripts/linux-launch-check.sh zig-out/bin/keywise

      - name: Drive the interactive Linux TUI through a PTY
        run: python3 scripts/linux-tui-check.py zig-out/bin/keywise

  linux-arm-test:
    # There is no ubuntu-latest-arm alias.
    runs-on: ubuntu-24.04-arm

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-linux-${{ env.ZIG_VERSION }}
          key: zig-aarch64-linux-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: test-check
        run: ZIG=./zig/zig-aarch64-linux-${ZIG_VERSION}/zig ./scripts/test-check.sh --no-oracle

      - name: Build the TUI for aarch64-linux-musl and record its sum
        id: build
        run: |
          ./zig/zig-aarch64-linux-${ZIG_VERSION}/zig build \
            -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe
          count=$(readelf -l zig-out/bin/keywise | grep -c INTERP || true)
          [ "$count" -eq 0 ] || { echo "keywise carries a PT_INTERP segment" >&2; exit 1; }
          sum=$(sha256sum zig-out/bin/keywise | cut -d' ' -f1)
          echo "sha256 $sum  aarch64-linux-musl  built on ubuntu-24.04-arm"
          echo "- \`aarch64-linux-musl\` built on \`ubuntu-24.04-arm\`: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Drive the non-interactive Linux paths
        run: ./scripts/linux-launch-check.sh zig-out/bin/keywise

      - name: Drive the interactive Linux TUI through a PTY
        run: python3 scripts/linux-tui-check.py zig-out/bin/keywise

  compare-sums:
    # Fails if a native build differs from the macOS cross-compilation.
    needs: [macos-test, windows-test, windows-arm-test, linux-test, linux-arm-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: x86_64-windows-gnu, from macos-15 and windows-latest
        run: >
          scripts/ci-compare-sums.sh x86_64-windows-gnu
          "macos-15=${{ needs.macos-test.outputs.win_x86_64 }}"
          "windows-latest=${{ needs.windows-test.outputs.sum }}"

      - name: aarch64-windows-gnu, from macos-15 and windows-11-arm
        run: >
          scripts/ci-compare-sums.sh aarch64-windows-gnu
          "macos-15=${{ needs.macos-test.outputs.win_arm64 }}"
          "windows-11-arm=${{ needs.windows-arm-test.outputs.sum }}"

      - name: x86_64-linux-musl, from macos-15 and ubuntu-latest
        run: >
          scripts/ci-compare-sums.sh x86_64-linux-musl
          "macos-15=${{ needs.macos-test.outputs.linux_x86_64 }}"
          "ubuntu-latest=${{ needs.linux-test.outputs.sum }}"

      - name: aarch64-linux-musl, from macos-15 and ubuntu-24.04-arm
        run: >
          scripts/ci-compare-sums.sh aarch64-linux-musl
          "macos-15=${{ needs.macos-test.outputs.linux_arm64 }}"
          "ubuntu-24.04-arm=${{ needs.linux-arm-test.outputs.sum }}"

  macos-reproducible:
    # A second build must match macos-test byte for byte.
    needs: [macos-test]
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: Download the macos-test archive hashes
        uses: actions/download-artifact@v8
        with:
          name: release-hashes
          path: /tmp/ci-hashes

      - name: Package once
        run: ./scripts/release-package.sh 0.0.0-repro-check dist

      - name: Compare against macos-test
        run: |
          echo "tar_hash=$(shasum -a 256 dist/keywise-aarch64-macos.tar.gz | cut -d' ' -f1)" > local-hashes.env
          echo "app_hash=$(shasum -a 256 dist/Keywise-*-macos.zip | cut -d' ' -f1)" >> local-hashes.env
          echo "win_x64=$(shasum -a 256 dist/Keywise-*-windows-x86_64.zip | cut -d' ' -f1)" >> local-hashes.env
          echo "win_arm=$(shasum -a 256 dist/Keywise-*-windows-arm64.zip | cut -d' ' -f1)" >> local-hashes.env
          echo "--- macos-test ---"
          cat /tmp/ci-hashes/archive-hashes.env
          echo "--- this runner ---"
          cat local-hashes.env
          diff /tmp/ci-hashes/archive-hashes.env local-hashes.env \
            && echo "reproducible: both runners match byte for byte"
