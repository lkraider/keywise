name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-and-test:
    # The oracle test in core/test/oracle.zig links libsqlite3 through the
    # macOS SDK stub, and the macOS app needs Swift. Package.swift's
    # swift-tools-version asks for Swift 6. macos-15's default Xcode ships
    # Swift 6. macos-14's default Xcode ships Swift 5.10.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      # One invocation, so the build runner schedules both step trees at once
      # against one cache. Debug here, and windows-test runs the same suite at
      # ReleaseSafe.
      - name: test-check
        run: ZIG=./zig/zig-aarch64-macos-${ZIG_VERSION}/zig ./scripts/test-check.sh smoke

      - name: Build the Zig core (release, for the macOS app to link)
        run: ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build -Doptimize=ReleaseSafe

      - name: swift test
        working-directory: macos
        run: swift test -Xswiftc -F -Xswiftc /Library/Developer/CommandLineTools/Library/Developer/Frameworks

      - name: Bundle the macOS app (release)
        working-directory: macos
        run: ./scripts/bundle.sh


  windows-test:
    # Runs the core tests and builds the app on the platform it ships for.
    # -Doracle=false drops the differential test, since a Windows runner has
    # no sqlite3 development install.
    runs-on: windows-latest

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # Three zig processes at once: two builds of the exe and the test suite.
      #
      # The tests run at ReleaseSafe. scripts/release-package.sh builds the
      # released exe with that mode. Measured on Zig 0.16.0: it fills
      # undefined memory with
      # 0xAA, as Debug does, and keeps the bounds, overflow and alignment
      # checks. It also runs the optimizer, so this step tests the code
      # generation of a released exe. build-and-test runs the suite in Debug.
      - name: Test and build the app twice, in parallel
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target x86_64-windows-gnu -Twice -WithTests

      - name: Launch the app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  windows-arm-test:
    # Runs the arm64 exe the release ships. No x86_64 host can load an ARM64
    # PE, and windows-latest above is x86_64.
    #
    # This job drives the x86_64 toolchain under Windows-on-ARM emulation and
    # cross-compiles, the way scripts/release-package.sh cross-compiles from
    # macOS. Zig 0.16.0's own aarch64-windows build answers `zig version` and
    # `zig env`, then dies on `zig build` with exit -1073741819, an access
    # violation, and prints nothing. `zig build test` therefore runs on
    # windows-latest and on macos-15, and this job builds and launches.
    runs-on: windows-11-arm

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      # The same cache entry windows-test fills. One download serves both.
      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # One build. The emulated compiler took 192 seconds for it, and
      # windows-test above already builds twice against the same toolchain.
      - name: Cross-compile the arm64 app and record its sum
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target aarch64-windows-gnu

      - name: Launch the arm64 app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  linux-test:
    # The first native run of the suite on Linux. build.zig reads
    # host_has_sqlite from builtin.os.tag == .macos, so the oracle skips itself
    # and this runner installs no libsqlite3 headers.
    runs-on: ubuntu-latest

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-linux-${{ env.ZIG_VERSION }}
          key: zig-x86_64-linux-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: test-check
        run: ZIG=./zig/zig-x86_64-linux-${ZIG_VERSION}/zig ./scripts/test-check.sh --no-oracle

      - name: Build the TUI for x86_64-linux-musl and record its sum
        id: build
        run: |
          ./zig/zig-x86_64-linux-${ZIG_VERSION}/zig build \
            -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
          # `file` calls a static PIE "static-pie linked", so a grep for
          # "statically linked" fails on a correct binary. PT_INTERP decides.
          count=$(readelf -l zig-out/bin/keywise | grep -c INTERP || true)
          [ "$count" -eq 0 ] || { echo "keywise carries a PT_INTERP segment" >&2; exit 1; }
          sum=$(sha256sum zig-out/bin/keywise | cut -d' ' -f1)
          echo "sha256 $sum  x86_64-linux-musl  built on ubuntu-latest"
          echo "- \`x86_64-linux-musl\` built on \`ubuntu-latest\`: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Drive the paths that run without a terminal
        run: ./scripts/linux-launch-check.sh zig-out/bin/keywise

  linux-arm-test:
    # Runs the aarch64 binary a release ships. ubuntu-24.04-arm is free for a
    # public repository. There is no ubuntu-latest-arm alias.
    runs-on: ubuntu-24.04-arm

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-linux-${{ env.ZIG_VERSION }}
          key: zig-aarch64-linux-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: test-check
        run: ZIG=./zig/zig-aarch64-linux-${ZIG_VERSION}/zig ./scripts/test-check.sh --no-oracle

      - name: Build the TUI for aarch64-linux-musl and record its sum
        id: build
        run: |
          ./zig/zig-aarch64-linux-${ZIG_VERSION}/zig build \
            -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe
          count=$(readelf -l zig-out/bin/keywise | grep -c INTERP || true)
          [ "$count" -eq 0 ] || { echo "keywise carries a PT_INTERP segment" >&2; exit 1; }
          sum=$(sha256sum zig-out/bin/keywise | cut -d' ' -f1)
          echo "sha256 $sum  aarch64-linux-musl  built on ubuntu-24.04-arm"
          echo "- \`aarch64-linux-musl\` built on \`ubuntu-24.04-arm\`: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Drive the paths that run without a terminal
        run: ./scripts/linux-launch-check.sh zig-out/bin/keywise

  compare-sums:
    # Asserts that every build host produced the same exe. reproducible-build,
    # windows-test and windows-arm-test each publish one sum per target they
    # build, and `needs` holds this job until all three have finished. Nothing
    # here builds, so the runner that starts fastest runs it.
    needs: [reproducible-build, windows-test, windows-arm-test, linux-test, linux-arm-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: x86_64-windows-gnu, from macos-15 and windows-latest
        run: >
          scripts/ci-compare-sums.sh x86_64-windows-gnu
          "macos-15=${{ needs.reproducible-build.outputs.win_x86_64 }}"
          "windows-latest=${{ needs.windows-test.outputs.sum }}"

      - name: aarch64-windows-gnu, from macos-15 and windows-11-arm
        run: >
          scripts/ci-compare-sums.sh aarch64-windows-gnu
          "macos-15=${{ needs.reproducible-build.outputs.win_arm64 }}"
          "windows-11-arm=${{ needs.windows-arm-test.outputs.sum }}"

      - name: x86_64-linux-musl, from macos-15 and ubuntu-latest
        run: >
          scripts/ci-compare-sums.sh x86_64-linux-musl
          "macos-15=${{ needs.reproducible-build.outputs.linux_x86_64 }}"
          "ubuntu-latest=${{ needs.linux-test.outputs.sum }}"

      - name: aarch64-linux-musl, from macos-15 and ubuntu-24.04-arm
        run: >
          scripts/ci-compare-sums.sh aarch64-linux-musl
          "macos-15=${{ needs.reproducible-build.outputs.linux_arm64 }}"
          "ubuntu-24.04-arm=${{ needs.linux-arm-test.outputs.sum }}"

  reproducible-build:
    # Packages the release artifacts twice from a clean state and diffs
    # them. This catches a regression in build.zig's strip, bundle.sh's
    # -gnone, or the tar/ditto flags in scripts/release-package.sh. Each
    # of those exists to keep this build byte-for-byte reproducible.
    runs-on: macos-15

    outputs:
      win_x86_64: ${{ steps.sums.outputs.win_x86_64 }}
      win_arm64: ${{ steps.sums.outputs.win_arm64 }}
      linux_x86_64: ${{ steps.sums.outputs.linux_x86_64 }}
      linux_arm64: ${{ steps.sums.outputs.linux_arm64 }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: Package once
        run: ./scripts/release-package.sh 0.0.0-repro-check dist1

      # The binaries the packaging step above put in the archives.
      # compare-sums reads these through this job's outputs, and the clean
      # below deletes the prefixes that hold them.
      - name: Record each cross-compiled binary's sum
        id: sums
        run: |
          for pair in "win-x86_64 Keywise.exe" "win-arm64 Keywise.exe" \
                      "linux-x86_64 keywise" "linux-arm64 keywise"; do
            set -- $pair
            sum=$(shasum -a 256 "out-$1/bin/$2" | cut -d' ' -f1)
            echo "sha256 $sum  $1  built on macOS ARM64"
            echo "- \`$1\` built on \`macOS ARM64\`, the host that builds a release: \`$sum\`" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "$(echo "$1" | tr - _)=$sum" >> "$GITHUB_OUTPUT"
          done

      - name: Clean every build artifact
        # release-package.sh gives each cross build its own cache and prefix.
        run: rm -rf .zig-cache zig-out macos/.build .zig-cache-* out-*

      - name: Package again
        run: ./scripts/release-package.sh 0.0.0-repro-check dist2

      - name: Compare
        run: |
          echo "--- run 1 ---"
          (cd dist1 && shasum -a 256 * | sort)
          echo "--- run 2 ---"
          (cd dist2 && shasum -a 256 * | sort)
          diff <(cd dist1 && shasum -a 256 * | sort) <(cd dist2 && shasum -a 256 * | sort) \
            && echo "reproducible: both packaging runs match byte for byte"
